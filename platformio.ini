; TTGO T-Display ESP32 SDR: spectrum / waterfall on the TFT, esp-web-sdr in the
; browser (WiFi), esp-sdr protocol on USB. Based on ESPARGOS/esp-sdr.
; Build:   pio run              (in this directory)
; Flash:   pio run -t upload    (board on COM7, adjust below if different)
; Monitor: pio device monitor   (2 Mbaud, shared with the esp-sdr protocol)

[platformio]
default_envs = ttgo-t-display

[env:ttgo-t-display]
; pioarduino = community-maintained Espressif32 platform tracking the latest
; arduino-esp32 core (3.x, ESP-IDF 5.x; ships esp-dsp and esp_http_server
; with WebSocket support)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
; regenerates src/web_assets.h from web/ when the viewer files change
extra_scripts = pre:tools/pio_build_web.py

; esp-sdr's UART protocol runs at 2 Mbaud; console logs share the port and
; pause while a protocol client is connected
monitor_speed = 2000000
upload_speed = 921600
upload_port = COM7
monitor_port = COM7
monitor_filters = esp32_exception_decoder

lib_deps =
  https://github.com/Bodmer/TFT_eSPI.git

build_flags =
  ; ---- TTGO T-Display (ST7789 135x240), configured entirely via build flags
  ; so the library stays stock. Mirrors TFT_eSPI Setup25_TTGO_T_Display.h
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MOSI=19
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=16
  -DTFT_RST=23
  -DTFT_BL=4
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=6000000
